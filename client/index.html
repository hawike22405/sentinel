<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel — Verify links before you click</title>
    <meta name="description" content="Sentinel detects phishing and malicious websites through threat analysis, web security assessment, certificate validation, and collaborative threat intelligence.">
    <meta name="theme-color" content="#0b1120">
  </head>
  <body>
    <div id="ribbon" style="height:150px"></div>
    <div id="checks" style="width:100vw;height:70vh;margin-left:calc(50% - 50vw)"></div>
    <div id="root"></div>
    <script type="module">
      import { mountRibbon } from './assets/js/ribbon.js';
      import { mountChecksCarousel } from './assets/js/checks-carousel.js';
      mountRibbon(document.getElementById('ribbon'),
        ['Threat intelligence', 'Threat analysis', 'Web security', 'Certificate validation']);
      mountChecksCarousel(document.getElementById('checks'));
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
